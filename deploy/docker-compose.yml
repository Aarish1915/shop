services:
  shopkeeper-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: cleannotes-shopkeeper-server
    ports:
      - "8001:8001"
    environment:
      - DOCUMORPH_ENV=development
      - DOCUMORPH_B2B_SECRET=b2b_dev_secret_key_12345
      - DOCUMORPH_B2B_DB=/app/server/data/b2b.db
      - ALLOWED_ORIGINS=http://localhost:5174,http://127.0.0.1:5174
    volumes:
      - shopkeeper_data:/app/server/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  shopkeeper_data:
