name: CleanNotes Shopkeeper POS CI/CD Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  shopkeeper-pos-ci:
    name: Shopkeeper POS Quality & Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: server/requirements.txt

      - name: Install Server Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pytest httpx

      - name: Run Backend & Security Tests (40/40)
        run: |
          python -m pytest tests/ -v

      - name: Gate 4-3 Dependency Security Audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r server/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Build Web POS Production Bundle
        run: |
          npm ci
          npm run build

      - name: Verify Docker Container Build
        run: |
          docker build -f deploy/Dockerfile -t cleannotes-pos:latest .
